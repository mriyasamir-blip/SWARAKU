  <!-- Wordmark 'S W A R A K U' in Bold Geometric Sans-serif -->
  <text
    x="400"
    y="650"
    text-anchor="middle"
    fill="#081225"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
    font-size="68"
    font-weight="900"
    letter-spacing="0.22em"
