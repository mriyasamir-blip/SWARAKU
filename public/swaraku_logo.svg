      d="M 58 72
         L -8 40
         L -66 128
         C -28 152, 54 168, 54 196
         C 54 216, 32 232, 2 232
         C -40 232, -68 206, -72 174
         L -136 174
         L -142 206
         C -128 258, -80 286, 0 286
         C 78 286, 128 244, 128 188
         C 128 132, 86 100, 42 78
         Z"
